[project]
name = "flower-power-games-ai-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ovidiu-lates", email = "ovidiu-alexandru.lates@endava.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "pyjwt>=2.10.1",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.20",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "openai>=3.17.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smart_review_ai"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[project]
name = "flower-power-games-ai-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ovidiu-lates", email = "ovidiu-alexandru.lates@endava.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
flower-power-games-ai-review = "flower_power_games_ai_review:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
